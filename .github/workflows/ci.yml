name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements.lock
      # Docker/Testcontainers integration tests are outside this CI job.
      - name: Run offline tests
        run: python -m pytest -q -m "not integration"
