<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>资料与事实确认</title>
<style>body{font-family:system-ui;max-width:960px;margin:2rem auto;padding:0 1rem}label{display:block;margin:.5rem 0}input,textarea,select{padding:.4rem;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:70px}fieldset{margin:1rem 0;padding:1rem}button{margin:.4rem;padding:.4rem}#message{white-space:pre-wrap;color:#a03020}small{display:block}</style></head>
<body><a href="/">返回审核台</a><h1>资料与事实确认</h1>
<p>导入和修改后的资料为草稿，确认后事实才可用于生成。确认是您对资料和证据来源的声明，不代表外部核验。教育信息只在教育事实中维护。</p>
<p id="message" role="status"></p><h2>联系资料</h2><p id="profile-status"></p><form id="profile-form"></form>
<h2>导入简历文字</h2><textarea id="import-text" aria-label="简历文字"></textarea><button id="import-button">提取为草稿</button>
<h2>事实库（含教育）</h2><button id="new-fact">新建事实</button><div id="facts"></div>
<script>
const message=document.getElementById('message');
const labels={name:'姓名',email:'电子邮箱',phone:'电话',location:'所在城市',website:'个人主页',source_name:'经历来源',content:'事实描述',school:'学校',degree:'学历/学位',major:'专业',start_date:'开始日期',end_date:'结束日期',skills:'技能（逗号分隔）',metrics:'量化指标原文（逗号分隔）',evidence_ref:'证据地址或标识',project:'项目',internship:'实习',skill:'技能',award:'奖项',education:'教育',self_report:'本人陈述',document:'文档',commit:'代码提交',test:'测试记录'};
const statusLabel=status=>status==='confirmed'?'已确认':'草稿';
async function request(path,method='GET',data){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const result=await r.json();if(!r.ok)throw new Error(r.status+': '+JSON.stringify(result.detail||result));return result;}
function button(parent,text,action){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=async()=>{try{message.textContent='';await action();}catch(e){message.textContent=e.message;}};parent.append(b);return b;}
function guardUnsaved(form){let dirty=false;form.addEventListener('input',()=>dirty=true);form.addEventListener('change',()=>dirty=true);return ()=>{if(dirty)throw new Error('请先保存修改，再确认当前修订。');};}
function field(parent,name,value='',type='text'){const label=document.createElement('label');label.textContent=(labels[name]||name)+' ';const input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;input.name=name;input.value=value??'';label.append(input);parent.append(label);return input;}
async function loadProfile(){const p=await request('/api/profile');document.getElementById('profile-status').textContent=statusLabel(p.status)+' · 修订号 '+p.revision;const form=document.getElementById('profile-form');form.replaceChildren();const checkSaved=guardUnsaved(form);const inputs={};for(const name of ['name','email','phone','location','website'])inputs[name]=field(form,name,p.profile?.[name]);button(form,'保存资料草稿',async()=>{const profile=Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value]));await request('/api/profile','PUT',{expected_revision:p.revision,profile});await loadProfile();});if(p.profile)button(form,'确认当前资料',async()=>{checkSaved();await request('/api/profile/confirm','POST',{expected_revision:p.revision});await loadProfile();});}
function factEditor(f){const box=document.createElement('fieldset');const checkSaved=guardUnsaved(box);const legend=document.createElement('legend');legend.textContent=f.id?(f.source_name||'事实')+' · '+statusLabel(f.status)+' · 修订号 '+f.revision+(f.enabled?'':' · 已停用'):'新事实（草稿）';box.append(legend);const inputs={};const type=document.createElement('select');type.name='fact_type';type.setAttribute('aria-label','事实类型');for(const name of ['project','internship','skill','award','education']){const option=document.createElement('option');option.value=name;option.textContent=labels[name]||name;type.append(option);}type.value=f.fact_type||'project';box.append(type);inputs.fact_type=type;for(const name of ['source_name','content','school','degree','major','start_date','end_date','skills','metrics','evidence_ref'])inputs[name]=field(box,name,Array.isArray(f[name])?f[name].join(', '):f[name],name==='content'?'textarea':name.endsWith('_date')?'date':'text');const evidence=document.createElement('select');evidence.name='evidence_type';evidence.setAttribute('aria-label','证据类型');for(const name of ['self_report','document','commit','test']){const o=document.createElement('option');o.value=name;o.textContent=labels[name]||name;evidence.append(o);}evidence.value=f.evidence_type||'self_report';box.append(evidence);inputs.evidence_type=evidence;
button(box,'保存事实草稿',async()=>{const data=Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value]));for(const k of ['skills','metrics'])data[k]=data[k].split(',').map(x=>x.trim()).filter(Boolean);for(const k of ['start_date','end_date'])data[k]=data[k]||null;if(f.id)data.expected_revision=f.revision;await request(f.id?'/api/facts/'+f.id:'/api/facts',f.id?'PUT':'POST',data);await loadFacts();});
if(f.id){button(box,'确认当前事实',async()=>{checkSaved();await request('/api/facts/'+f.id+'/confirm','POST',{expected_revision:f.revision});await loadFacts();});button(box,f.enabled?'停用事实':'启用为草稿',async()=>{await request('/api/facts/'+f.id,'PUT',{expected_revision:f.revision,enabled:!f.enabled});await loadFacts();});button(box,'查看修订历史',async()=>{const history=await request('/api/facts/'+f.id+'/revisions');const pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.textContent=JSON.stringify(history,null,2);box.append(pre);});}return box;}
async function loadFacts(){const facts=await request('/api/facts?enabled=false');const container=document.getElementById('facts');container.replaceChildren(...facts.map(factEditor));}
document.getElementById('new-fact').onclick=()=>document.getElementById('facts').prepend(factEditor({}));
document.getElementById('import-button').onclick=async()=>{try{const result=await request('/api/facts/import','POST',{resume_text:document.getElementById('import-text').value});message.textContent='已提取 '+result.created+' 条草稿；跳过 '+result.skipped;await loadFacts();}catch(e){message.textContent=e.message;}};
Promise.all([loadProfile(),loadFacts()]).catch(e=>message.textContent=e.message);
</script></body></html>
